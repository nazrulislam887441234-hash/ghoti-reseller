
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>রিসেলার নিবন্ধন তথ্য — Reseller Ghoti Market</title>
    <meta name="description" content="আপনার বাকি তথ্য দিয়ে রিসেলার নিবন্ধন সম্পন্ন করুন।">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://reseller.ghotimarket.com/signup1">

    <link rel="icon" type="image/png" href="https://reseller.ghotimarket.com/photo/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="signup1.css">
    <meta name="theme-color" content="#FF6B35">
</head>

<body>

    <!-- Page Loader -->
    <div id="pageLoader" class="page-loader">
        <div class="loader-content">
            <img src="https://reseller.ghotimarket.com/photo/logo.png" alt="Logo" class="loader-logo">
            <div class="spinner-large"></div>
            <p>যাচাই করা হচ্ছে...</p>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">

            <div class="logo-container">
                <img src="https://reseller.ghotimarket.com/photo/logo.png" alt="Reseller Ghoti Market Logo" class="brand-logo">
            </div>

            <div class="header-section">
                <h1>রিসেলার প্রোফাইল তথ্য</h1>
                <p>আপনার সঠিক তথ্য দিয়ে একাউন্ট সম্পন্ন করুন।</p>
            </div>

            <form id="profileForm" novalidate>

                <!-- Full Name -->
                <div class="input-group">
                    <label for="name">আপনার পুরো নাম</label>

                    <div class="input-field-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                            placeholder="আপনার পুরো নাম লিখুন"
                            autocomplete="name"
                        >
                    </div>

                    <span class="error-msg" id="nameError"></span>
                </div>

                <!-- Phone -->
                <div class="input-group">
                    <label for="phone">মোবাইল নাম্বার</label>

                    <div class="input-field-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                            <line x1="12" y1="18" x2="12.01" y2="18"></line>
                        </svg>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            required
                            placeholder="01712345678"
                            maxlength="11"
                            inputmode="numeric"
                            autocomplete="tel"
                        >
                    </div>

                    <span class="error-msg" id="phoneError"></span>
                </div>

                <!-- WhatsApp -->
                <div class="input-group">
                    <label for="whatsapp">হোয়াটসঅ্যাপ নাম্বার</label>

                    <div class="input-field-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>

                        <input
                            type="tel"
                            id="whatsapp"
                            name="whatsapp"
                            required
                            placeholder="01712345678"
                            maxlength="11"
                            inputmode="numeric"
                        >
                    </div>

                    <span class="error-msg" id="whatsappError"></span>
                </div>

                <!-- Privacy Policy & Terms Agreement -->
                <div class="agreement-group">

                    <label class="agreement-label" for="policyAgreement">

                        <input
                            type="checkbox"
                            id="policyAgreement"
                            name="policyAgreement"
                        >

                        <span class="custom-checkbox"></span>

                        <span class="agreement-text">
                            আমি আপনাদের
                            <a href="#" id="privacyLink">প্রাইভেসি পলিসি</a>
                            এবং
                            <a href="#" id="termsLink">শর্তাবলী / টার্মস</a>
                            পড়েছি এবং এতে উল্লেখিত শর্তাবলীতে সম্মতি প্রদান করছি।
                        </span>

                    </label>

                    <span class="error-msg" id="agreementError"></span>

                </div>

                <!-- Submit -->
                <button type="submit" id="submitBtn" class="primary-btn">

                    <span class="btn-text">একাউন্ট সম্পন্ন করুন</span>

                    <span class="spinner" style="display: none;"></span>

                </button>

            </form>
        </div>
    </div>

    <!-- Privacy Policy & Terms Overlay -->
    <div id="policyOverlay" class="policy-overlay">

        <div class="policy-modal">

            <div class="policy-header">

                <h2 id="policyTitle">প্রাইভেসি পলিসি</h2>

                <button
                    type="button"
                    id="closePolicy"
                    class="close-policy"
                    aria-label="Close"
                >
                    &times;
                </button>

            </div>

            <iframe
                id="policyFrame"
                src="about:blank"
                title="Privacy Policy and Terms"
                loading="lazy"
            ></iframe>

        </div>

    </div>

    <!-- Toast -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- JavaScript -->
    <script type="module" src="signup1.js"></script>

</body>
</html>
