<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন — GHOTI RESELLER</title>
  <style>
    :root {
      --primary: #0B0F19;
      --primary-light: #1E293B;
      --accent: #FF6B00;
      --accent-hover: #E05E00;
      --bg-gradient: linear-gradient(135deg, #FFF8F5 0%, #FFEDDF 100%);
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --error-color: #EF4444;
      --radius: 16px;
      --shadow: 0 20px 40px -10px rgba(11, 15, 25, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .login-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 36px 28px;
      overflow: hidden;
    }

    /* Verification Overlay - Enabled by default on page load */
    .verification-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      transition: opacity 0.3s ease;
    }

    .verify-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    .verify-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.3px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-header img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .brand-header h1 {
      font-size: 22px;
      color: var(--primary);
      font-weight: 800;
      margin-bottom: 6px;
    }

    .brand-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .alert-box {
      background-color: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: var(--error-color);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }

    .forgot-link {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }

    .input-container {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      transition: all 0.25s ease;
      background-color: #FAFAFB;
      color: var(--text-main);
    }

    .form-control:focus {
      border-color: var(--accent);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.1);
    }

    .password-toggle-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .password-toggle-btn:hover {
      color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(255, 107, 0, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .divider {
      margin: 24px 0;
      border: none;
      border-top: 1px solid var(--border-color);
    }

    .footer-terms {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .footer-terms a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-terms a:hover {
      text-decoration: underline;
    }

    .signup-section {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .signup-section a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }
    .signup-section a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <!-- Verification Overlay Screen (Visible by default on page load) -->
    <div id="verificationOverlay" class="verification-overlay">
      <div class="verify-spinner"></div>
      <div class="verify-text">আপনাকে যাচাই করা হচ্ছে...</div>
    </div>

    <div class="brand-header">
      <img src="https://reseller.ghotimarket.com/logo.png" alt="লোগো" onerror="this.src='https://via.placeholder.com/60?text=GR'">
      <h1>লগইন করুন</h1>
      <p>আপনার GHOTI RESELLER অ্যাকাউন্টে প্রবেশ করুন</p>
    </div>

    <div id="errorAlert" class="alert-box"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="emailInput">ইমেইল</label>
        <div class="input-container">
          <input type="email" id="emailInput" class="form-control" placeholder="আপনার ইমেইল লিখুন" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label for="passwordInput">পাসওয়ার্ড</label>
          <a href="forgot-password.html" class="forgot-link">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>
        <div class="input-container">
          <input type="password" id="passwordInput" class="form-control" placeholder="আপনার পাসওয়ার্ড লিখুন" autocomplete="current-password">
          <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="পাসওয়ার্ড দেখান">
            <!-- Eye Icon (Show) -->
            <svg id="eyeOpenIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye Off Icon (Hide) -->
            <svg id="eyeClosedIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="btnText">লগইন করুন</span>
        <div id="btnSpinner" class="spinner"></div>
      </button>
    </form>

    <hr class="divider">

    <div class="footer-terms">
      শর্তাবলী ও গোপনীয়তা মেনে আপনি লগইন করছেন।<br>
      <a href="terms.html">শর্তাবলী</a> ও <a href="privacy-policy.html">প্রাইভেসি পলিসি</a>
    </div>

    <div class="signup-section">
      আপনার কি অ্যাকাউন্ট নেই?<a href="signup.html">অ্যাকাউন্ট তৈরি করুন</a>
    </div>
  </div>

  <!-- Firebase Modular SDK Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
      authDomain: "ghotimarket.firebaseapp.com",
      databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",
      projectId: "ghotimarket",
      storageBucket: "ghotimarket.firebasestorage.app",
      messagingSenderId: "481257644093",
      appId: "1:481257644093:web:0dfc3699d6b3c86afeca54",
      measurementId: "G-4SR8V2EKC1"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Elements
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorAlert = document.getElementById('errorAlert');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeOpenIcon = document.getElementById('eyeOpenIcon');
    const eyeClosedIcon = document.getElementById('eyeClosedIcon');
    const verificationOverlay = document.getElementById('verificationOverlay');

    // Helper: Show Verification Overlay
    function showVerification() {
      verificationOverlay.style.display = 'flex';
    }

    // Helper: Hide Verification Overlay
    function hideVerification() {
      verificationOverlay.style.display = 'none';
    }

    // Helper: Show Error Message
    function showError(message) {
      errorAlert.textContent = message;
      errorAlert.style.display = 'block';
    }

    // Helper: Hide Error Message
    function hideError() {
      errorAlert.textContent = '';
      errorAlert.style.display = 'none';
    }

    // Helper: Set Button Loading State
    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnText.textContent = 'লগইন হচ্ছে...';
        btnSpinner.style.display = 'block';
      } else {
        btnText.textContent = 'লগইন করুন';
        btnSpinner.style.display = 'none';
      }
    }

    // Email format validator helper
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // Password Toggle Visibility
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      if (type === 'text') {
        eyeOpenIcon.style.display = 'none';
        eyeClosedIcon.style.display = 'block';
        togglePasswordBtn.setAttribute('aria-label', 'পাসওয়ার্ড লুকান');
      } else {
        eyeOpenIcon.style.display = 'block';
        eyeClosedIcon.style.display = 'none';
        togglePasswordBtn.setAttribute('aria-label', 'পাসওয়ার্ড দেখান');
      }
    });

    // Check Auth State: Automatically shows verification on page load, hides if not logged in
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        showVerification();
        try {
          const userDocRef = doc(db, "reseller", user.uid);
          const userDocSnap = await getDoc(userDocRef);
          if (userDocSnap.exists()) {
            const data = userDocSnap.data();
            if (data.active !== false) {
              window.location.href = "dashboard.html";
              return;
            } else {
              hideVerification();
              showError("আপনার অ্যাকাউন্ট বর্তমানে নিষ্ক্রিয় রয়েছে। অনুগ্রহ করে সাপোর্টে যোগাযোগ করুন।");
            }
          } else {
            hideVerification();
            showError("আপনার reseller অ্যাকাউন্টের তথ্য পাওয়া যায়নি।");
          }
        } catch (e) {
          hideVerification();
        }
      } else {
        // Not logged in -> Hide verification overlay and show login interface smoothly
        hideVerification();
      }
    });

    // Handle Form Submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Validation
      if (!email) {
        showError("ইমেইল লিখুন");
        emailInput.focus();
        return;
      }
      if (!isValidEmail(email)) {
        showError("সঠিক ইমেইল লিখুন");
        emailInput.focus();
        return;
      }
      if (!password) {
        showError("পাসওয়ার্ড লিখুন");
        passwordInput.focus();
        return;
      }

      setLoading(true);

      try {
        // Firebase Authentication Sign In
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Show verification screen during database status query
        setLoading(false);
        showVerification();

        // Check Firestore Reseller Document Status
        const userDocRef = doc(db, "reseller", user.uid);
        const userDocSnap = await getDoc(userDocRef);

        if (!userDocSnap.exists()) {
          throw new Error("ACCOUNT_NOT_FOUND");
        }

        const resellerData = userDocSnap.data();

        if (resellerData.active === false) {
          throw new Error("ACCOUNT_INACTIVE");
        }

        // Successful verification -> Redirect to dashboard
        window.location.href = "dashboard.html";

      } catch (err) {
        setLoading(false);
        hideVerification();

        let errorMessage = "লগইন করা সম্ভব হয়নি। আবার চেষ্টা করুন।";

        if (err.message === "ACCOUNT_INACTIVE") {
          errorMessage = "আপনার অ্যাকাউন্ট বর্তমানে নিষ্ক্রিয় রয়েছে। অনুগ্রহ করে সাপোর্টে যোগাযোগ করুন।";
        } else if (err.message === "ACCOUNT_NOT_FOUND") {
          errorMessage = "আপনার reseller অ্যাকাউন্টের তথ্য পাওয়া যায়নি।";
        } else {
          switch (err.code) {
            case 'auth/invalid-credential':
            case 'auth/wrong-password':
            case 'auth/user-not-found':
              errorMessage = "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়";
              break;
            case 'auth/too-many-requests':
              errorMessage = "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
              break;
            case 'auth/network-request-failed':
              errorMessage = "ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।";
              break;
            default:
              errorMessage = "লগইন করা সম্ভব হয়নি। আবার চেষ্টা করুন।";
              break;
          }
        }

        showError(errorMessage);
      }
    });
  </script>
</body>
</html>
