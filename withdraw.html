  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
      authDomain: "ghotimarket.firebaseapp.com",
      databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",
      projectId: "ghotimarket",
      storageBucket: "ghotimarket.firebasestorage.app",
      messagingSenderId: "481257644093",
      appId: "1:481257644093:web:0dfc3699d6b3c86afeca54",
      measurementId: "G-4SR8V2EKC1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loadingState = document.getElementById('loadingState');
    const withdrawContent = document.getElementById('withdrawContent');
    const errorState = document.getElementById('errorState');
    const errorTitle = document.getElementById('errorTitle');
    const errorDesc = document.getElementById('errorDesc');
    const errorActionBtn = document.getElementById('errorActionBtn');
    const toast = document.getElementById('toast');

    let currentUserObj = null;

    function showToast(message) {
      toast.innerText = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      currentUserObj = user;

      try {
        const resellerRef = doc(db, "reseller", user.uid);
        const resellerSnap = await getDoc(resellerRef);

        if (!resellerSnap.exists()) {
          loadingState.classList.add('hidden');
          errorTitle.innerText = "রিসেলার প্রোফাইল পাওয়া যায়নি";
          errorDesc.innerText = "আপনার রিসেলার অ্যাকাউন্টের তথ্য খুঁজে পাওয়া যায়নি।";
          errorActionBtn.innerText = "লগইন পেজে যান";
          errorActionBtn.onclick = () => { window.location.href = 'login.html'; };
          errorState.classList.remove('hidden');
          errorState.classList.add('flex');
          return;
        }

        const data = resellerSnap.data();

        if (data.active !== true || data.verified !== true) {
          loadingState.classList.add('hidden');
          errorTitle.innerText = "অ্যাকাউন্ট সক্রিয় নয়";
          errorDesc.innerText = "আপনার রিসেলার অ্যাকাউন্ট বর্তমানে উইথড্র করার জন্য সক্রিয় নয়।";
          errorActionBtn.innerText = "হোম পেজে যান";
          errorActionBtn.onclick = () => { window.location.href = 'index.html'; };
          errorState.classList.remove('hidden');
          errorState.classList.add('flex');
          return;
        }

        const authEmail = user.email || "";
        const docEmail = data.Email || "";
        if (authEmail && docEmail && authEmail.trim().toLowerCase() !== docEmail.trim().toLowerCase()) {
          loadingState.classList.add('hidden');
          errorTitle.innerText = "ইমেইল মিলেনি";
          errorDesc.innerText = "আপনার অ্যাকাউন্টের ইমেইল তথ্যের সাথে মিল পাওয়া যায়নি।";
          errorActionBtn.innerText = "লগইন পেজে যান";
          errorActionBtn.onclick = () => { window.location.href = 'login.html'; };
          errorState.classList.remove('hidden');
          errorState.classList.add('flex');
          return;
        }

        const balance = Number(data.balance || 0);
        const formattedBalance = '৳ ' + balance.toLocaleString('bn-BD', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

        document.getElementById('inputUid').value = user.uid;
        document.getElementById('inputEmail').value = authEmail || docEmail;
        document.getElementById('inputPhone').value = data.Phone || "তথ্য পাওয়া যায়নি";
        document.getElementById('walletBalance').innerText = formattedBalance;
        document.getElementById('displayBalanceField').value = formattedBalance;

        await loadWithdrawHistory(user.uid);

        loadingState.classList.add('hidden');
        withdrawContent.classList.remove('hidden');

      } catch (error) {
        console.error("Error loading withdraw page:", error);
        loadingState.classList.add('hidden');
        errorTitle.innerText = "তথ্য লোড করা যায়নি";
        errorDesc.innerText = "সার্ভার থেকে তথ্য আনতে সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।";
        errorActionBtn.innerText = "আবার চেষ্টা করুন";
        errorActionBtn.onclick = () => location.reload();
        errorState.classList.remove('hidden');
        errorState.classList.add('flex');
      }
    });

    async function loadWithdrawHistory(uid) {
      const historyContainer = document.getElementById('historyContainer');
      const pendingNotice = document.getElementById('pendingNotice');
      
      try {
        const q = query(
          collection(db, "withdraw"),
          where("uid", "==", uid)
        );
        const querySnapshot = await getDocs(q);

        const withdrawals = [];
        querySnapshot.forEach((docSnap) => {
          withdrawals.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        withdrawals.sort((a, b) => {
          const aTime = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt?.seconds ? a.createdAt.seconds * 1000 : 0);
          const bTime = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt?.seconds ? b.createdAt.seconds * 1000 : 0);
          return bTime - aTime;
        });

        if (withdrawals.length === 0) {
          historyContainer.innerHTML = `<div class="text-center py-6 text-muted text-sm">কোনো উইথড্র ইতিহাস পাওয়া যায়নি।</div>`;
          pendingNotice.classList.add('hidden');
          return;
        }

        let hasPending = false;
        let htmlContent = '';

        withdrawals.forEach((item) => {
          const amount = Number(item.amount || 0);
          const formattedAmt = '৳ ' + amount.toLocaleString('bn-BD', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          
          let dateStr = "তারিখ উপলব্ধ নেই";
          if (item.createdAt) {
            let dateObj = null;
            if (typeof item.createdAt.toDate === 'function') {
              dateObj = item.createdAt.toDate();
            } else if (item.createdAt.seconds) {
              dateObj = new Date(item.createdAt.seconds * 1000);
            } else if (item.createdAt instanceof Date) {
              dateObj = item.createdAt;
            }
            if (dateObj && !isNaN(dateObj)) {
              dateStr = dateObj.toLocaleDateString('bn-BD', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              });
            }
          }

          let statusClass = "bg-amber-100 text-amber-800";
          let statusText = "অপেক্ষমাণ";

          if (item.status === "approved") {
            statusClass = "bg-green-100 text-green-800";
            statusText = "অনুমোদিত";
          } else if (item.status === "rejected") {
            statusClass = "bg-red-100 text-red-800";
            statusText = "প্রত্যাখ্যাত";
          } else if (item.status === "pending") {
            hasPending = true;
          }

          htmlContent += `
            <div class="p-4 bg-background rounded-xl border border-border flex items-center justify-between">
              <div>
                <span class="text-base font-bold text-dark block">${formattedAmt}</span>
                <span class="text-xs text-muted block mt-0.5">${dateStr}</span>
              </div>
              <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${statusClass}">
                ${statusText}
              </span>
            </div>
          `;
        });

        historyContainer.innerHTML = htmlContent;

        if (hasPending) {
          pendingNotice.classList.remove('hidden');
        } else {
          pendingNotice.classList.add('hidden');
        }

      } catch (err) {
        console.error("Error loading history:", err);
        historyContainer.innerHTML = `<div class="p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm text-center">উইথড্র ইতিহাস লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে কিছুক্ষণ পরে আবার চেষ্টা করুন।</div>`;
        pendingNotice.classList.add('hidden');
      }
    }

    window.handleWithdraw = async function(event) {
      event.preventDefault();
      if (!currentUserObj) return;

      const inputElem = document.getElementById('withdrawAmountInput');
      const errorMsgElem = document.getElementById('formErrorMsg');
      const submitBtn = document.getElementById('submitBtn');
      const submitBtnText = document.getElementById('submitBtnText');

      errorMsgElem.classList.add('hidden');
      errorMsgElem.innerText = "";

      const rawVal = inputElem.value;
      const withdrawAmount = Number(rawVal);

      if (rawVal === "" || isNaN(withdrawAmount) || !isFinite(withdrawAmount) || withdrawAmount <= 0) {
        errorMsgElem.innerText = "সঠিক উইথড্র পরিমাণ লিখুন।";
        errorMsgElem.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtnText.innerText = "অনুরোধ পাঠানো হচ্ছে...";

      try {
        const freshResellerSnap = await getDoc(doc(db, "reseller", currentUserObj.uid));
        
        if (!freshResellerSnap.exists()) {
          throw new Error("Reseller document not found");
        }

        const freshResellerData = freshResellerSnap.data();
        const freshBalance = Number(freshResellerData.balance || 0);

        if (freshResellerData.active !== true || freshResellerData.verified !== true) {
          showToast("আপনার অ্যাকাউন্ট বর্তমানে সক্রিয় বা যাচাইকৃত নয়।");
          submitBtn.disabled = false;
          submitBtnText.innerText = "উইথড্র করুন";
          return;
        }

        if (withdrawAmount > freshBalance) {
          errorMsgElem.innerText = "আপনার বর্তমান ব্যালেন্সের চেয়ে বেশি টাকা উইথড্র করা যাবে না।";
          errorMsgElem.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtnText.innerText = "উইথড্র করুন";
          return;
        }

        const withdrawData = {
          uid: currentUserObj.uid,
          email: currentUserObj.email || freshResellerData.Email || "",
          phone: freshResellerData.Phone || "",
          amount: withdrawAmount,
          balanceAtRequest: freshBalance,
          status: "pending",
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        };

        await addDoc(collection(db, "withdraw"), withdrawData);

        showToast("আপনার উইথড্র অনুরোধ সফলভাবে পাঠানো হয়েছে।");
        inputElem.value = "";

        const updatedFormattedBalance = '৳ ' + freshBalance.toLocaleString('bn-BD', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
        document.getElementById('walletBalance').innerText = updatedFormattedBalance;
        document.getElementById('displayBalanceField').value = updatedFormattedBalance;

        await loadWithdrawHistory(currentUserObj.uid);

      } catch (err) {
        console.error("Error submitting withdraw request:", err);
        showToast("অনুরোধ পাঠানো যায়নি। আবার চেষ্টা করুন।");
      } finally {
        submitBtn.disabled = false;
        submitBtnText.innerText = "উইথড্র করুন";
      }
    };
  </script>
</body>
</html>
