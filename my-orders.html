<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* ==========================
   FIREBASE
========================== */

const firebaseConfig = {
  apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
  authDomain: "ghotimarket.firebaseapp.com",
  databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",
  projectId: "ghotimarket",
  storageBucket: "ghotimarket.firebasestorage.app",
  messagingSenderId: "481257644093",
  appId: "1:481257644093:web:0dfc3699d6b3c86afeca54",
  measurementId: "G-4SR8V2EKC1"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* ==========================
   DOM
========================== */

const loading = document.getElementById("loading");
const ordersContainer = document.getElementById("orders");
const empty = document.getElementById("empty");
const errorBox = document.getElementById("errorBox");
const errorText = document.getElementById("errorText");

const accessDenied = document.getElementById("accessDenied");
const accessMessage = document.getElementById("accessMessage");

const dbBalance = document.getElementById("dbBalance");

const search = document.getElementById("search");
const statusFilter = document.getElementById("statusFilter");


/* ==========================
   VARIABLES
========================== */

let currentUser = null;
let resellerData = null;
let allOrders = [];


/* ==========================
   MONEY FORMAT
========================== */

function money(value) {

  value = Number(value || 0);

  return "৳ " + value.toLocaleString("bn-BD", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

}


/* ==========================
   TIMESTAMP
========================== */

function getDate(timestamp) {

  if (!timestamp) return 0;

  if (
    typeof timestamp === "object" &&
    timestamp.seconds
  ) {
    return timestamp.seconds * 1000;
  }

  if (
    typeof timestamp === "number"
  ) {
    return timestamp;
  }

  return new Date(timestamp).getTime() || 0;

}


/* ==========================
   BANGLA DATE
========================== */

function formatDate(timestamp) {

  const time = getDate(timestamp);

  if (!time) {
    return "তারিখ পাওয়া যায়নি";
  }

  return new Date(time).toLocaleString("bn-BD", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
    hour12: true
  });

}


/* ==========================
   STATUS
========================== */

function statusInfo(status) {

  const data = {

    pending: {
      text: "অপেক্ষমাণ",
      cls: "bg-amber-100 text-amber-700"
    },

    confirmed: {
      text: "নিশ্চিত",
      cls: "bg-blue-100 text-blue-700"
    },

    processing: {
      text: "প্রক্রিয়াধীন",
      cls: "bg-purple-100 text-purple-700"
    },

    shipped: {
      text: "পাঠানো হয়েছে",
      cls: "bg-indigo-100 text-indigo-700"
    },

    delivered: {
      text: "ডেলিভারি সম্পন্ন",
      cls: "bg-emerald-100 text-emerald-700"
    },

    return: {
      text: "রিটার্ন",
      cls: "bg-orange-100 text-orange-700"
    },

    cancelled: {
      text: "বাতিল",
      cls: "bg-red-100 text-red-700"
    }

  };

  return data[status] || {
    text: status || "অজানা",
    cls: "bg-slate-100 text-slate-700"
  };

}


/* ==========================
   ACCESS DENIED
========================== */

function denyAccess(message) {

  loading.classList.add("hidden");

  accessMessage.textContent = message;

  accessDenied.classList.remove("hidden");
  accessDenied.classList.add("flex");

}


/* ==========================
   ERROR
========================== */

function showError(message) {

  loading.classList.add("hidden");

  errorBox.classList.remove("hidden");

  errorText.textContent = message;

}


/* ==========================
   AUTH
========================== */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    window.location.href = "login.html";

    return;

  }


  currentUser = user;


  console.log("Firebase Auth UID:", user.uid);
  console.log("Firebase Auth Email:", user.email);


  try {

    /* ==========================
       RESELLER DOCUMENT
    ========================== */

    const resellerRef = doc(
      db,
      "reseller",
      user.uid
    );

    const resellerSnap = await getDoc(resellerRef);


    if (!resellerSnap.exists()) {

      denyAccess(
        "আপনার UID-এর জন্য reseller ডকুমেন্ট পাওয়া যায়নি।"
      );

      return;

    }


    resellerData = resellerSnap.data();


    console.log(
      "Reseller document:",
      resellerData
    );


    /* ==========================
       SECURITY CHECK
    ========================== */

    if (
      resellerData.uid !== user.uid
    ) {

      denyAccess(
        "আপনার reseller UID এবং Firebase Auth UID মিলছে না।"
      );

      return;

    }


    if (
      resellerData.active !== true
    ) {

      denyAccess(
        "আপনার reseller অ্যাকাউন্ট বর্তমানে সক্রিয় নয়।"
      );

      return;

    }


    if (
      resellerData.verified !== true
    ) {

      denyAccess(
        "আপনার reseller অ্যাকাউন্ট এখনো যাচাই করা হয়নি।"
      );

      return;

    }


    /* ==========================
       BALANCE
    ========================== */

    const accountBalance =
      Number(resellerData.balance || 0);


    dbBalance.textContent =
      money(accountBalance);


    /* ==========================
       LOAD ORDERS
    ========================== */

    await loadOrders(user.uid);

  }

  catch (error) {

    console.error(
      "INITIALIZATION ERROR:",
      error
    );

    showError(
      "তথ্য লোড করতে সমস্যা হয়েছে: " +
      error.message
    );

  }

});


/* ==========================
   LOAD ORDERS
========================== */

async function loadOrders(uid) {

  loading.classList.remove("hidden");

  errorBox.classList.add("hidden");


  try {

    const q = query(
      collection(db, "reseller_order"),
      where(
        "resellerUid",
        "==",
        uid
      )
    );


    const snapshot = await getDocs(q);


    allOrders = [];


    snapshot.forEach((docSnap) => {

      allOrders.push({
        id: docSnap.id,
        ...docSnap.data()
      });

    });


    console.log(
      "Total reseller orders:",
      allOrders.length
    );

    console.log(
      "Loaded orders:",
      allOrders
    );


    /* ==========================
       SORT CLIENT SIDE
    ========================== */

    allOrders.sort((a, b) => {

      return getDate(b.createdAt) -
             getDate(a.createdAt);

    });


    /* ==========================
       DISPLAY
    ========================== */

    renderOrders();


    loading.classList.add("hidden");

  }

  catch (error) {

    console.error(
      "ORDER LOAD ERROR:",
      error
    );

    loading.classList.add("hidden");

    showError(
      "অর্ডার লোড করা যায়নি। Firestore Rules এবং resellerUid পরীক্ষা করুনবো।\n\n" +
      error.message
    );

  }

}


/* ==========================
   RENDER ORDERS
========================== */

function renderOrders() {

  const term =
    search.value.trim().toLowerCase();


  const status =
    statusFilter.value;


  const filtered =
    allOrders.filter(order => {

      const orderId =
        String(
          order.humanOrderId ||
          order.id ||
          ""
        ).toLowerCase();


      const product =
        String(
          order.productName ||
          ""
        ).toLowerCase();


      const customer =
        String(
          order.customerName ||
          ""
        ).toLowerCase();


      const matchesSearch =
        !term ||
        orderId.includes(term) ||
        product.includes(term) ||
        customer.includes(term);


      const matchesStatus =
        status === "all" ||
        order.status === status;


      return (
        matchesSearch &&
        matchesStatus
      );

    });


  ordersContainer.innerHTML = "";


  if (
    filtered.length === 0
  ) {

    ordersContainer.classList.add("hidden");

    empty.classList.remove("hidden");

    return;

  }


  empty.classList.add("hidden");

  ordersContainer.classList.remove("hidden");


  filtered.forEach(order => {

    const card =
      document.createElement("div");


    card.className =
      "bg-white rounded-2xl border border-border shadow-sm p-4";


    const status =
      statusInfo(order.status);


    const productName =
      order.productName ||
      "নামবিহীন পণ্য";


    const image =
      order.productImage || "";


    const unitPrice =
      Number(order.unitPrice || 0);


    const sellingRate =
      Number(order.sellingRate || 0);


    const quantity =
      Number(order.quantity || 1);


    let deliveryCharge =
      Number(order.deliveryCharge || 0);


    if (
      deliveryCharge <= 0
    ) {

      deliveryCharge =
        order.deliveryZone === "outside"
          ? 120
          : 60;

    }


    const address =
      order.deliveryAddress
        ? [
            order.deliveryAddress.thana,
            order.deliveryAddress.district
          ]
          .filter(Boolean)
          .join(", ")
        : "ঠিকানা পাওয়া যায়নি";


    card.innerHTML = `

      <div>

        <div class="flex items-center justify-between pb-3 mb-3 border-b border-border">

          <span class="font-bold text-sm">
            ${escapeHtml(
              order.humanOrderId ||
              order.id
            )}
          </span>

          <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${status.cls}">
            ${status.text}
          </span>

        </div>


        <div class="flex gap-3 mb-4">

          <div class="w-16 h-16 rounded-xl overflow-hidden bg-slate-100 flex-shrink-0">

            ${
              image
              ?
              `
              <img
                src="${escapeHtml(image)}"
                alt=""
                class="w-full h-full object-cover">
              `
              :
              `
              <div class="w-full h-full flex items-center justify-center">

                <svg class="w-7 h-7 text-slate-400"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                  <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.5"
                        d="M4 16l4.5-4.5a2 2 0 012.8 0L16 16l2-2a2 2 0 012.8 0L22 16M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>

              </div>
              `
            }

          </div>


          <div class="min-w-0">

            <h3 class="font-bold text-sm truncate">
              ${escapeHtml(productName)}
            </h3>

            <p class="text-xs text-muted mt-1">
              গ্রাহক:
              ${escapeHtml(
                order.customerName ||
                "নাম নেই"
              )}
            </p>

            <p class="text-xs text-muted">
              ফোন:
              ${escapeHtml(
                order.customerPhone ||
                "নেই"
              )}
            </p>

          </div>

        </div>


        <div class="bg-slate-50 rounded-xl p-3 text-xs space-y-2">

          <div class="flex justify-between">
            <span class="text-muted">
              পরিমাণ
            </span>
            <strong>
              ${quantity} টি
            </strong>
          </div>


          <div class="flex justify-between">
            <span class="text-muted">
              পাইকারি মূল্য
            </span>
            <strong>
              ${money(unitPrice)}
            </strong>
          </div>


          <div class="flex justify-between">
            <span class="text-muted">
              বিক্রির রেট
            </span>
            <strong>
              ${money(sellingRate)}
            </strong>
          </div>


          <div class="flex justify-between">
            <span class="text-muted">
              ডেলিভারি চার্জ
            </span>

            <strong>
              ${money(deliveryCharge)}
            </strong>

          </div>


          <div class="flex justify-between border-t border-border pt-2">

            <span class="font-semibold">
              মোট
            </span>

            <strong class="text-primary">
              ${money(
                Number(
                  order.totalAmount || 0
                )
              )}
            </strong>

          </div>

        </div>


        <div class="mt-3 text-xs text-muted">

          <p>
            ঠিকানা:
            <span class="text-dark">
              ${escapeHtml(address)}
            </span>
          </p>

          <p class="mt-1">
            তারিখ:
            ${formatDate(order.createdAt)}
          </p>

        </div>

      </div>

    `;


    ordersContainer.appendChild(card);

  });

}


/* ==========================
   HTML ESCAPE
========================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ==========================
   SEARCH
========================== */

search.addEventListener(
  "input",
  renderOrders
);


statusFilter.addEventListener(
  "change",
  renderOrders
);

</script>

</body>
</html>
