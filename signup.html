<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিসেলার একাউন্ট তৈরি করুন — Reseller Ghoti Market</title>
    <meta name="description" content="Reseller Ghoti Market-এ রিসেলার হিসেবে নিবন্ধন করুন।">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://reseller.ghotimarket.com/signup">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://reseller.ghotimarket.com/photo/favicon.png">
    
    <!-- Google Fonts: Hind Siliguri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="signup.css">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="রিসেলার একাউন্ট তৈরি করুন — Reseller Ghoti Market">
    <meta property="og:description" content="আপনার ইমেইল ও পাসওয়ার্ড দিয়ে শুরু করুন।">
    <meta property="og:image" content="https://reseller.ghotimarket.com/photo/logo.png">
    <meta property="og:url" content="https://reseller.ghotimarket.com/signup">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#FF6B35">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-container">
                <img src="https://reseller.ghotimarket.com/photo/logo.png" alt="Reseller Ghoti Market Logo" class="brand-logo">
            </div>
            
            <div class="header-section">
                <h1>রিসেলার একাউন্ট তৈরি করুন</h1>
                <p>আপনার ইমেইল ও পাসওয়ার্ড দিয়ে শুরু করুন।</p>
            </div>

            <form id="signupForm" novalidate>
                <div class="input-group">
                    <label for="email">ইমেইল ঠিকানা</label>
                    <div class="input-field-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="email" name="email" required placeholder="example@gmail.com" autocomplete="email">
                    </div>
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="input-group">
                    <label for="password">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                    <div class="input-field-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                        <button type="button" id="togglePassword" class="toggle-password-btn" aria-label="পাসওয়ার্ড দেখান বা লুকান">
                            <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <span class="error-msg" id="passwordError"></span>
                </div>

                <button type="submit" id="submitBtn" class="primary-btn">
                    <span class="btn-text">এগিয়ে যান</span>
                    <span class="spinner" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- Custom Toast / Popup Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Main JavaScript Logic -->
    <script type="module" src="signup.js"></script>
</body>
</html>
